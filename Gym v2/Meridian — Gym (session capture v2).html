<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meridian — Gym Session Capture</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@latest"></script>
<style>
:root{
  /* Meridian DS tokens */
  --color-primary:#0F766E; --color-primary-hover:#115E59; --color-primary-active:#134E4A;
  --color-primary-soft:#CCFBF1; --color-primary-tint:#F0FDFA; --color-primary-border:#99F6E4; --color-primary-ink:#134E4A;
  --color-page:#F6F8FA; --color-surface:#FFFFFF; --color-surface-subtle:#F9FAFB; --color-surface-muted:#F1F5F9;
  --color-border:#E5E7EB; --color-border-subtle:#EEF2F6; --color-separator:#E6EAF0;
  --color-text:#111827; --color-text-muted:#4B5563; --color-text-soft:#6B7280; --color-text-disabled:#9CA3AF; --color-text-inverse:#FFFFFF;
  --color-success:#16A34A; --color-success-soft:#DCFCE7; --color-success-ink:#166534;
  --color-warning:#D97706; --color-warning-soft:#FEF3C7; --color-warning-ink:#92400E;
  --color-danger:#DC2626; --color-danger-soft:#FEE2E2; --color-danger-ink:#991B1B;
  --color-review:#7C3AED; --color-review-soft:#EDE9FE;
  --color-yellow:#EAB308; --color-yellow-ink:#CA8A04;
  --r-sm:6px; --r-md:10px; --r-lg:12px; --r-xl:16px; --r-pill:999px;
  --shadow-card:0 1px 2px rgba(15,23,42,.04);
  --ff:"Inter Display","Inter",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  --side:248px; --top:52px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--ff);background:var(--color-page);color:var(--color-text);font-feature-settings:"tnum" 1,"cv05" 1;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;line-height:14px;font-weight:400;letter-spacing:.09em;text-transform:uppercase;color:var(--color-text-soft)}

/* ---------- app shell (topbar + sidebar) ---------- */
.topbar{position:fixed;top:0;left:0;right:0;height:var(--top);background:var(--color-surface);border-bottom:1px solid var(--color-separator);display:flex;align-items:center;gap:14px;padding:0 20px;z-index:40}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:.02em}
.brand .mark{width:20px;height:20px;border-radius:50%;border:2px solid var(--color-primary);display:grid;place-items:center}
.brand .mark::after{content:"";width:2px;height:10px;background:var(--color-primary);transform:rotate(25deg)}
.brand .club{color:var(--color-text-soft);font-weight:600;font-size:13px;padding-left:12px;border-left:1px solid var(--color-separator)}
.topbar .ctx{margin-left:6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-soft)}
.topbar .sp{flex:1}
.btn{font-family:var(--ff);font-size:13px;font-weight:600;border-radius:var(--r-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text);height:36px;padding:0 14px;display:inline-flex;align-items:center;gap:7px;cursor:pointer}
.btn:hover{background:var(--color-surface-subtle)}
.btn.primary{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.btn.primary:hover{background:var(--color-primary-hover)}
.btn svg{width:16px;height:16px}
.avatar{width:30px;height:30px;border-radius:50%;background:var(--color-primary);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.side{position:fixed;top:var(--top);bottom:0;left:0;width:var(--side);background:var(--color-surface);border-right:1px solid var(--color-separator);padding:16px 12px;display:flex;flex-direction:column;gap:4px;overflow:auto;z-index:30;transition:width .2s ease}
.side .grp{margin:14px 8px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-md);color:var(--color-text-muted);font-size:13.5px;font-weight:500;cursor:pointer;text-decoration:none}
.nav svg{width:18px;height:18px;color:var(--color-text-soft)}
.nav:hover{background:var(--color-surface-subtle)}
.nav.active{background:var(--color-primary-tint);color:var(--color-primary-ink);font-weight:600}
.nav.active svg{color:var(--color-primary)}
.nav .badge{margin-left:auto;background:var(--color-warning-soft);color:var(--color-warning-ink);font-size:11px;font-weight:700;border-radius:var(--r-pill);padding:1px 8px}
.navtoggle{width:34px;height:34px;border-radius:var(--r-md);border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-soft);display:grid;place-items:center;cursor:pointer;flex:none}
.navtoggle:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.navtoggle svg{width:18px;height:18px}
body.nav-collapsed{--side:64px}
body.nav-collapsed .side{padding:16px 8px}
body.nav-collapsed .side .grp{display:none}
body.nav-collapsed .nav{position:relative;justify-content:center;padding:9px 0;gap:0}
body.nav-collapsed .nav .lbl{display:none}
body.nav-collapsed .nav .badge{position:absolute;top:1px;right:9px;margin:0;min-width:15px;height:15px;padding:0 4px;display:grid;place-items:center;line-height:1}
.side-foot{margin-top:auto;padding-top:12px;border-top:1px solid var(--color-separator);display:flex;flex-direction:column;gap:10px}
.sidecta{width:100%;justify-content:center}
.profile{display:flex;align-items:center;gap:10px;padding:2px}
.profile .pname{font-size:13px;font-weight:600;color:var(--color-text)}
body.nav-collapsed .side-foot{align-items:center}
body.nav-collapsed .sidecta{width:36px;padding:0}
body.nav-collapsed .sidecta .lbl{display:none}
body.nav-collapsed .profile .pname{display:none}
.main{margin-left:var(--side);margin-top:var(--top);transition:margin-left .2s ease}
@media(max-width:920px){:root{--side:0px}.side{display:none}}

/* ---------- week strip ---------- */
.weekstrip{display:flex;align-items:stretch;gap:0;background:var(--color-surface-muted);border-bottom:1px solid var(--color-separator);padding:0 28px}
.days{display:flex;gap:6px;align-items:stretch}
.day{width:64px;padding:10px 0 12px;display:flex;flex-direction:column;align-items:center;gap:3px;border-radius:0 0 var(--r-md) var(--r-md);position:relative;background:none;border:0;cursor:pointer;font-family:inherit}
.day .dow{font-size:10px;letter-spacing:.08em;font-weight:500;color:var(--color-text-soft)}
.day .dnum{font-size:18px;font-weight:600;color:var(--color-text);font-variant-numeric:tabular-nums}
.day.sel{background:var(--color-primary-tint);box-shadow:inset 0 0 0 1px var(--color-primary-border)}
.day.sel .dnum{color:var(--color-primary)}
.day .dot{width:6px;height:6px;border-radius:50%;background:var(--color-review);position:absolute;bottom:5px}
.day.future{opacity:.4;cursor:default;pointer-events:none}
.day.future .dnum{color:var(--color-text-disabled)}
.weeknav{width:30px;height:46px;border:0;background:none;color:var(--color-text-soft);display:grid;place-items:center;cursor:pointer;border-radius:var(--r-md);align-self:center}
.weeknav:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.weeknav svg{width:18px;height:18px}
.todaybtn{font-family:var(--ff);font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-muted);border-radius:var(--r-md);padding:7px 12px;cursor:pointer;align-self:center;white-space:nowrap;margin-left:4px}
.todaybtn:hover{background:var(--color-surface-subtle);color:var(--color-text)}
.wklabel{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-soft);font-weight:600;white-space:nowrap;align-self:center;margin-right:6px;min-width:80px}
.wk-sep{width:1px;background:var(--color-separator);margin:14px 22px 14px auto}
.wk-session{display:flex;align-items:center;gap:12px}
.wk-session .lab{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--color-text-soft);font-weight:500}
.sesspicker{display:inline-flex;gap:6px}
.sesspill{font-family:var(--ff);font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border-radius:var(--r-pill);padding:7px 15px;white-space:nowrap;cursor:pointer;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-muted);transition:background .12s,color .12s,border-color .12s}
.sesspill:hover{background:var(--color-surface-subtle)}
.sesspill.active{background:var(--color-primary);border-color:var(--color-primary);color:#fff}
.wk-session .lab{white-space:nowrap}
.wk-note{margin-left:auto;align-self:center;max-width:300px;text-align:right}

/* ---------- page ---------- */
.wrap{max-width:1360px;margin:0 auto;padding:28px 28px 72px}
.pagehead{display:flex;align-items:flex-start;gap:24px;margin-bottom:22px}
.pagehead .meta{flex:1;min-width:0}
h1{font-size:34px;line-height:40px;font-weight:700;letter-spacing:-.01em;margin:6px 0 8px}
.subline{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-soft);font-weight:500}

/* filters */
.filters{display:flex;gap:8px;flex-wrap:wrap;align-self:flex-start;padding-top:6px}
.filt{font-family:var(--ff);font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;border:1px solid var(--color-border);background:var(--color-surface);color:var(--color-text-muted);border-radius:var(--r-md);padding:9px 15px;cursor:pointer;transition:background .12s,color .12s,border-color .12s}
.filt:hover{background:var(--color-surface-subtle)}
.filt.active{background:var(--color-primary);border-color:var(--color-primary);color:#fff}

/* summary */
.summary{display:flex;gap:16px;margin-bottom:24px;align-items:stretch}
.sumbars{flex:1;background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:18px 22px;display:flex;flex-direction:column;gap:13px;justify-content:center}
.brow{display:flex;align-items:center;gap:14px}
.blab{width:116px;flex:none;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-text-soft);font-weight:600}
.btrack{flex:1;height:12px;background:var(--color-surface-muted);border-radius:var(--r-pill);overflow:hidden}
.btrack > i{display:block;height:100%;border-radius:var(--r-pill)}
.bval{width:32px;flex:none;text-align:right;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--color-text)}
.bf-neutral{background:var(--color-text-disabled)}
.bf-dark{background:var(--color-text-muted)}
.bf-plan{background:var(--color-success)}
.bf-partial{background:var(--color-yellow)}
.reviewcard{width:188px;flex:none;background:var(--color-warning-soft);border:1px solid #F0D28A;border-radius:var(--r-lg);padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:3px}
.rc-lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--color-warning-ink);font-weight:600}
.rc-val{font-size:40px;line-height:1;font-weight:700;color:var(--color-warning);font-variant-numeric:tabular-nums}
.rc-sub{font-size:12px;color:var(--color-warning-ink);opacity:.85}

/* grid */
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.pcard{background:var(--color-surface);border:1px solid var(--color-border);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:16px 18px 18px}
.pcard.dim{background:var(--color-surface-subtle)}
.pc-top{display:flex;align-items:center;gap:11px;margin-bottom:14px}
.pbadge{width:46px;height:46px;border-radius:50%;background:var(--color-primary);color:#fff;display:grid;place-items:center;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;flex:none;overflow:hidden;position:relative}
.pbadge img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pcard.dim .pbadge{background:var(--color-text-disabled)}
.pcard.dim .pbadge img{filter:grayscale(1);opacity:.8}
.pc-name{font-size:15px;font-weight:600;color:var(--color-text)}
.pcard.dim .pc-name{color:var(--color-text-soft)}
.pc-region{font-size:13.5px;color:var(--color-text-soft);font-weight:500;margin-bottom:8px}
.pc-status{font-size:12px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;margin-bottom:12px;display:flex;align-items:center;gap:5px}
.pc-status .tick{width:14px;height:14px;flex:none;stroke-width:2.5}
.s-plan{color:var(--color-success-ink)}
.s-partial{color:var(--color-yellow-ink)}
.s-review{color:var(--color-warning)}
.s-notobs{color:var(--color-text-disabled)}
.bar{height:4px;border-radius:var(--r-pill);background:var(--color-border-subtle);overflow:hidden}
.bar > i{display:block;height:100%;border-radius:var(--r-pill)}
.f-plan{background:var(--color-success)}
.f-partial{background:var(--color-yellow)}
.f-review{background:var(--color-warning)}

.empty{grid-column:1/-1;text-align:center;color:var(--color-text-soft);font-size:14px;padding:40px 0}

@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,1fr)}.summary{flex-direction:column;gap:12px}.reviewcard{width:auto}.pagehead{flex-direction:column}.filters{padding-top:0}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.weekstrip{overflow-x:auto}}
</style>
</head>
<body>

<div id="shell-top"></div>
<div id="shell-side"></div>

<main class="main">

<!-- week strip -->
<div class="weekstrip">
  <span class="wklabel" id="wkLabel"></span>
  <button class="weeknav" id="prevWk" aria-label="Previous week"><i data-lucide="chevron-left"></i></button>
  <div class="days" id="days"></div>
  <button class="weeknav" id="nextWk" aria-label="Next week"><i data-lucide="chevron-right"></i></button>
  <button class="todaybtn" id="todayBtn">Today</button>
  <button class="weeknav" id="calBtn" aria-label="Pick a date"><i data-lucide="calendar"></i></button>
  <input type="date" id="datePick" aria-label="Pick a date" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none">
  <div class="wk-sep"></div>
  <div class="wk-session">
    <div class="sesspicker" id="sesspicker">
      <button class="sesspill" data-sess="AM Gym 1">AM Gym 1</button>
      <button class="sesspill active" data-sess="PM Gym 1">PM Gym 1</button>
    </div>
  </div>
</div>

<div class="wrap">
  <!-- header -->
  <div class="pagehead">
    <div class="meta">
      <span class="eyebrow" style="color:var(--color-primary)">Gym · Auto session capture</span>
      <h1 id="sessTitle">Tue 08 Sep · PM Gym 1</h1>
      <div class="subline">15:00–16:05 · Four ceiling cameras</div>
    </div>
    <div class="filters" id="filters">
      <button class="filt active" data-f="all">All</button>
      <button class="filt" data-f="review">Requires review</button>
      <button class="filt" data-f="partial">Partial</button>
      <button class="filt" data-f="notobs">Not observed</button>
    </div>
  </div>

  <!-- summary -->
  <div class="summary" id="summary"></div>

  <!-- player grid -->
  <div class="grid" id="grid"></div>
</div>

</main>

<script>
// ---- data (dummy; edit here) ----
// week calendar (Sunday → Saturday, navigable)
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const SESSION_DAYS={'2026-09-08':true,'2026-09-09':true,'2026-09-10':true}; // illustrative
const TODAY=new Date(2026,8,10); TODAY.setHours(0,0,0,0); // prototype "today" = Thu 10 Sep 2026
let selected=new Date(2026,8,8);   // Tue 8 Sep 2026 (demo session day)
let currentSess='PM Gym 1';
function weekStartSun(d){const x=new Date(d);x.setHours(0,0,0,0);x.setDate(x.getDate()-x.getDay());return x;}
let viewStart=weekStartSun(selected);
function isoDay(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function sameDay(a,b){return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();}
function fmtDate(d){return DOW[d.getDay()]+' '+String(d.getDate()).padStart(2,'0')+' '+MONTHS[d.getMonth()];}

// status: plan | partial | review | notobs ; done = bar fraction (0..1)
const PLAYERS=[
  {n:'02',region:'Lower body',     st:'plan',    done:1.00},
  {n:'03',region:'Lower body',     st:'plan',    done:1.00},
  {n:'04',region:'Lower body',     st:'plan',    done:1.00},
  {n:'05',region:'Rehab block',    st:'partial', done:0.72},
  {n:'06',region:'Upper push',     st:'plan',    done:1.00},
  {n:'07',region:'Upper push',     st:'review',  done:0.62},
  {n:'08',region:'Upper push',     st:'plan',    done:1.00},
  {n:'09',region:'Posterior chain',st:'partial', done:0.70},
  {n:'10',region:'Posterior chain',st:'plan',    done:1.00},
  {n:'11',region:'Posterior chain',st:'review',  done:0.58},
  {n:'12',region:'Posterior chain',st:'plan',    done:1.00},
  {n:'14',region:'Lower body',     st:'plan',    done:1.00},
  {n:'15',region:'Lower body',     st:'plan',    done:1.00},
  {n:'16',region:'Upper push',     st:'notobs',  done:0.00},
  {n:'17',region:'Lower body',     st:'partial', done:0.64},
  {n:'18',region:'Upper push',     st:'plan',    done:1.00},
  {n:'19',region:'Posterior chain',st:'notobs',  done:0.00},
  {n:'20',region:'Posterior chain',st:'plan',    done:1.00},
  {n:'21',region:'Posterior chain',st:'notobs',  done:0.00},
  {n:'22',region:'Upper push',     st:'partial', done:0.66},
  {n:'23',region:'Upper push',     st:'plan',    done:1.00},
];

const LABEL={plan:'Plan met',partial:'Partial',review:'Requires review',notobs:'No activity observed'};

// ---- week strip (dynamic, navigable) ----
function renderWeek(){
  const host=document.getElementById('days');
  let html='';
  for(let i=0;i<7;i++){
    const d=new Date(viewStart); d.setDate(viewStart.getDate()+i);
    const sel=sameDay(d,selected), sess=!!SESSION_DAYS[isoDay(d)], fut=d.getTime()>TODAY.getTime();
    html+=`<button class="day${sel?' sel':''}${sess?' hassess':''}${fut?' future':''}" data-i="${i}"${fut?' disabled':''}><span class="dow">${DOW[d.getDay()].toUpperCase()}</span><span class="dnum num">${String(d.getDate()).padStart(2,'0')}</span>${sess?'<span class="dot"></span>':''}</button>`;
  }
  host.innerHTML=html;
  const end=new Date(viewStart); end.setDate(viewStart.getDate()+6);
  document.getElementById('wkLabel').textContent=(viewStart.getMonth()===end.getMonth())
    ? MONTHS[viewStart.getMonth()]+' '+viewStart.getFullYear()
    : MONTHS[viewStart.getMonth()]+'–'+MONTHS[end.getMonth()]+' '+end.getFullYear();
}
function updateTitle(){
  const t=document.getElementById('sessTitle'); if(t) t.textContent=fmtDate(selected)+' · '+currentSess;
  const ctx=document.querySelector('.topbar .ctx'); if(ctx) ctx.textContent='Gym · '+currentSess+' · '+fmtDate(selected);
}
document.getElementById('prevWk').onclick=function(){viewStart.setDate(viewStart.getDate()-7);renderWeek();};
document.getElementById('nextWk').onclick=function(){viewStart.setDate(viewStart.getDate()+7);renderWeek();};
document.getElementById('todayBtn').onclick=function(){selected=new Date(TODAY);viewStart=weekStartSun(selected);renderWeek();updateTitle();};
document.getElementById('calBtn').onclick=function(){var dp=document.getElementById('datePick');dp.value=isoDay(selected);dp.max=isoDay(TODAY);if(dp.showPicker){try{dp.showPicker();}catch(e){dp.focus();}}else dp.focus();};
document.getElementById('datePick').addEventListener('change',function(){
  if(!this.value)return; var p=this.value.split('-'); var d=new Date(+p[0],+p[1]-1,+p[2]);
  if(d.getTime()>TODAY.getTime())return;
  selected=d; viewStart=weekStartSun(selected); renderWeek(); updateTitle();
});
document.getElementById('days').addEventListener('click',function(e){
  const el=e.target.closest('.day'); if(!el||el.classList.contains('future'))return;
  const d=new Date(viewStart); d.setDate(viewStart.getDate()+(+el.dataset.i));
  selected=d; renderWeek(); updateTitle();
});
renderWeek();

// ---- summary (computed from data) ----
function counts(){
  const c={expected:PLAYERS.length,plan:0,partial:0,review:0,notobs:0};
  PLAYERS.forEach(p=>c[p.st]++);
  c.observed=c.plan+c.partial+c.review;
  return c;
}
function renderSummary(){
  const c=counts();
  const max=c.expected||1;
  const bars=[
    {lab:'Expected',val:c.expected,cls:'bf-neutral'},
    {lab:'Observed',val:c.observed,cls:'bf-dark'},
    {lab:'Plan met',val:c.plan,cls:'bf-plan'},
    {lab:'Partial',val:c.partial,cls:'bf-partial'},
  ];
  const barsHTML=bars.map(b=>
    `<div class="brow"><span class="blab">${b.lab}</span><div class="btrack"><i class="${b.cls}" style="width:${Math.round(b.val/max*100)}%"></i></div><span class="bval num">${b.val}</span></div>`
  ).join('');
  document.getElementById('summary').innerHTML=
    `<div class="sumbars">${barsHTML}</div>`+
    `<div class="reviewcard"><span class="rc-lab">Requires review</span><span class="rc-val num">${c.review}</span><span class="rc-sub">need a verdict</span></div>`;
}

// ---- grid ----
let filter='all';
function renderGrid(){
  const host=document.getElementById('grid');
  const rows=PLAYERS.filter(p=>filter==='all'||p.st===filter);
  if(!rows.length){host.innerHTML='<div class="empty">No players in this filter.</div>';return;}
  host.innerHTML=rows.map(p=>{
    const dim=p.st==='notobs';
    const isPlan=p.st==='plan';
    const tick=isPlan?'<i data-lucide="check" class="tick"></i>':'';
    const bar=(isPlan||dim)?'':`<div class="bar"><i class="f-${p.st}" style="width:${Math.round(p.done*100)}%"></i></div>`;
    return `<div class="pcard${dim?' dim':''}">
      <div class="pc-top"><span class="pbadge num"><img src="https://i.pravatar.cc/80?img=${+p.n}" alt="" loading="lazy" onerror="this.remove()">${p.n}</span><span class="pc-name">Player ${p.n}</span></div>
      <div class="pc-region">${p.region}</div>
      <div class="pc-status s-${p.st}">${tick}${LABEL[p.st]}</div>
      ${bar}
    </div>`;
  }).join('');
  if(window.lucide) lucide.createIcons();
}

// ---- filters ----
document.getElementById('filters').addEventListener('click',e=>{
  const b=e.target.closest('.filt'); if(!b)return;
  filter=b.dataset.f;
  document.querySelectorAll('.filt').forEach(x=>x.classList.toggle('active',x===b));
  renderGrid();
});

renderSummary();
renderGrid();

document.getElementById('sesspicker').addEventListener('click',function(e){
  var b=e.target.closest('.sesspill'); if(!b)return;
  currentSess=b.dataset.sess;
  this.querySelectorAll('.sesspill').forEach(function(x){x.classList.toggle('active',x===b);});

});

(function(){
  var HOME="../Meridian%20%E2%80%94%20Today%20(home)%20v1.html";
  var PLAYERS="../Meridian%20%E2%80%94%20Players%20(report-led%20v1).html";
  var GYM="Meridian%20%E2%80%94%20Gym%20(session%20capture%20v2).html"; // self (same folder)
  var NAV=[
    {k:'today',label:'Today',icon:'sun',href:HOME},
    {k:'review',label:'Review queue',icon:'clipboard-list',href:HOME+'#queue',badge:true},
    {group:'Tactical intelligence'},
    {k:'pressing',label:'Pressing',icon:'gauge'},
    {k:'scanning',label:'Scanning',icon:'eye'},
    {k:'setpieces',label:'Set pieces',icon:'target'},
    {k:'shape',label:'Team shape',icon:'layout-grid'},
    {group:'Physical'},
    {k:'gym',label:'Gym sessions',icon:'dumbbell',href:GYM},
    {group:'People'},
    {k:'players',label:'Players',icon:'user',href:PLAYERS},
    {k:'squad',label:'Squad trends',icon:'trending-up'}
  ];
  function esc(s){return (s==null?'':String(s));}
  window.MeridianShell=function(o){
    o=o||{};
    var club=o.club||'Northbank FC';
    var ctx=o.ctx||'';
    var active=o.active||'';
    var badge=(o.badge==null?'':o.badge);
    var actions=o.actions||[{label:'Plan a session',icon:'mic',primary:true}];
    var topActs=actions.filter(function(a){return !a.primary;});
    var primary=actions.filter(function(a){return a.primary;})[0];
    var acts=topActs.map(function(a){
      return '<button class="btn">'+(a.icon?'<i data-lucide="'+a.icon+'"></i>':'')+esc(a.label)+'</button>';
    }).join('');
    var top='<header class="topbar"><button class="navtoggle" id="navToggle" aria-label="Collapse navigation"><i data-lucide="panel-left"></i></button><div class="brand"><span class="mark"></span>MERIDIAN<span class="club">'+esc(club)+'</span></div>'+
      (ctx?'<span class="ctx">'+esc(ctx)+'</span>':'')+
      '<span class="sp"></span>'+acts+'</header>';
    var items='';
    NAV.forEach(function(n){
      if(n.group){items+='<div class="grp eyebrow">'+n.group+'</div>';return;}
      var isA=(n.k===active);
      var href=n.href||'';
      var badgeHtml=n.badge?'<span class="badge" id="navBadge">'+esc(badge)+'</span>':'';
      items+='<a class="nav'+(isA?' active':'')+'"'+(href?' href="'+href+'"':'')+'><i data-lucide="'+n.icon+'"></i><span class="lbl">'+n.label+'</span>'+badgeHtml+'</a>';
    });
    var cta=primary?'<button class="btn primary sidecta"><i data-lucide="'+(primary.icon||'mic')+'"></i><span class="lbl">'+esc(primary.label)+'</span></button>':'';
    var foot='<div class="side-foot">'+cta+'<div class="profile"><div class="avatar">YO</div><span class="pname lbl">Yohahn</span></div></div>';
    var side='<aside class="side">'+items+foot+'</aside>';
    var th=document.getElementById('shell-top'); if(th) th.outerHTML=top;
    var sh=document.getElementById('shell-side'); if(sh) sh.outerHTML=side;
    try{ if(localStorage.getItem('meridian-nav-collapsed')==='1') document.body.classList.add('nav-collapsed'); }catch(e){}
    var tg=document.getElementById('navToggle');
    if(tg) tg.onclick=function(){ var c=document.body.classList.toggle('nav-collapsed'); try{localStorage.setItem('meridian-nav-collapsed',c?'1':'0');}catch(e){} };
    if(window.lucide) lucide.createIcons();
  };
})();
MeridianShell({active:'gym',badge:7,club:'Northbank FC',ctx:'',actions:[{label:'Export',icon:'download'},{label:'Plan a session',icon:'mic',primary:true}]});
updateTitle();
</script>
