<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="background:rgba(255,255,255,.4);border:1px solid rgba(255,255,255,.8);border-radius:24px;-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);box-shadow:0 12px 32px rgba(16,24,40,.07),0 2px 6px rgba(16,24,40,.04),inset 0 1px 0 rgba(255,255,255,.95);padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px;font-family:'Inter Display',Inter,system-ui,sans-serif;color:#111827;height:100%;box-sizing:border-box;font-variant-numeric:tabular-nums">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:22px">
    <div style="font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#6B7280;white-space:nowrap">{{ t.title }}</div>
    <div style="display:flex;align-items:center;gap:10px">
      <sc-if value="{{ t.src }}" hint-placeholder-val="{{ false }}"><div style="font-size:11px;font-weight:600;color:#4B5563;border:1px solid #E5E7EB;border-radius:999px;padding:2px 8px;white-space:nowrap">{{ t.src }}</div></sc-if>
      <sc-if value="{{ t.watch }}" hint-placeholder-val="{{ false }}"><div style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#027BFC;cursor:pointer;white-space:nowrap" style-hover="color:#1C6EF0" onClick="{{ t.onWatch }}"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M2 1.2v7.6L8.6 5z" fill="currentColor"></path></svg>{{ t.watch }}</div></sc-if>
    </div>
  </div>
  <sc-if value="{{ t.head }}" hint-placeholder-val="{{ false }}"><div style="font-size:15px;font-weight:600;letter-spacing:-0.005em;text-wrap:pretty">{{ t.head }}</div></sc-if>
  <div style="display:flex;flex-direction:column">
    <div style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:12px;padding:2px 0 8px;border-bottom:1px solid #E5E7EB">
      <div></div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#4B5563;white-space:nowrap"><div style="width:8px;height:8px;border-radius:50%;corner-shape:round;flex:none;background:{{ t.cac }}"></div>{{ t.ca }}</div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:#4B5563;white-space:nowrap"><div style="width:8px;height:8px;border-radius:50%;corner-shape:round;flex:none;background:{{ t.cbc }}"></div>{{ t.cb }}</div>
    </div>
    <sc-for list="{{ t.rows }}" as="r" hint-placeholder-count="4">
      <div style="display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) minmax(0,1fr);gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #F1F5F9">
        <div style="font-size:13px;color:#4B5563;font-weight:500;text-wrap:pretty">{{ r.label }}</div>
        <div style="display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;border-radius:6px" style-hover="background:#F1F5F9" onClick="{{ r.openA }}">
          <div style="font-size:14px;font-weight:700;white-space:nowrap">{{ r.a }}</div>
          <sc-if value="{{ r.sa }}" hint-placeholder-val="{{ false }}"><div style="font-size:11.5px;color:#6B7280;white-space:nowrap">{{ r.sa }}</div></sc-if>
          <sc-if value="{{ r.bars }}" hint-placeholder-val="{{ false }}"><div style="height:4px;border-radius:2px;background:#F1F5F9;overflow:hidden"><div style="height:100%;border-radius:2px;width:{{ r.aw }}%;background:{{ t.cac }}"></div></div></sc-if>
        </div>
        <div style="display:flex;flex-direction:column;gap:3px;min-width:0;cursor:pointer;border-radius:6px" style-hover="background:#F1F5F9" onClick="{{ r.openB }}">
          <div style="font-size:14px;font-weight:700;white-space:nowrap">{{ r.b }}</div>
          <sc-if value="{{ r.sb }}" hint-placeholder-val="{{ false }}"><div style="font-size:11.5px;color:#6B7280;white-space:nowrap">{{ r.sb }}</div></sc-if>
          <sc-if value="{{ r.bars }}" hint-placeholder-val="{{ false }}"><div style="height:4px;border-radius:2px;background:#F1F5F9;overflow:hidden"><div style="height:100%;border-radius:2px;width:{{ r.bw }}%;background:{{ t.cbc }}"></div></div></sc-if>
        </div>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:320},&quot;t&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
