<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div class="pcard" style="margin-top:0;padding:0;padding:14px 16px 8px;display:flex;flex-direction:column;gap:10px;font-family:'Inter Display',Inter,system-ui,sans-serif;color:#111827;height:100%;box-sizing:border-box;font-variant-numeric:tabular-nums">
  <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:22px">
    <div style="font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#6B7280;white-space:nowrap">{{ t.title }}</div>
    <div style="display:flex;align-items:center;gap:10px">
      <sc-if value="{{ t.src }}" hint-placeholder-val="{{ false }}"><div style="font-size:11px;font-weight:600;color:#4B5563;border:1px solid #E5E7EB;border-radius:999px;padding:2px 8px;white-space:nowrap">{{ t.src }}</div></sc-if>
      <sc-if value="{{ t.watch }}" hint-placeholder-val="{{ false }}"><div style="display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:#1C3FCA;cursor:pointer;white-space:nowrap" style-hover="color:#1C6EF0" onClick="{{ t.onWatch }}"><svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor" style="flex:none;display:block"><path d="M8 5v14l11-7z"></path></svg>{{ t.watch }}</div></sc-if>
    </div>
  </div>
  <sc-if value="{{ t.head }}" hint-placeholder-val="{{ false }}"><div style="font-size:15px;font-weight:600;letter-spacing:-0.005em;text-wrap:pretty">{{ t.head }}</div></sc-if>
  <table class="dtable" style="width:100%"><thead><tr><th></th><th class="num" style="text-transform:none;font-weight:600;color:var(--color-text-muted)"><span style="display:inline-flex;align-items:center;gap:6px;justify-content:flex-end"><span style="width:8px;height:8px;border-radius:50%;corner-shape:round;display:inline-block;flex:none;background:{{ t.cac }}"></span>{{ t.ca }}</span></th><th class="num" style="text-transform:none;font-weight:600;color:var(--color-text-muted)"><span style="display:inline-flex;align-items:center;gap:6px;justify-content:flex-end"><span style="width:8px;height:8px;border-radius:50%;corner-shape:round;display:inline-block;flex:none;background:{{ t.cbc }}"></span>{{ t.cb }}</span></th></tr></thead><tbody><sc-for list="{{ t.rows }}" as="r" hint-placeholder-count="4"><tr><td style="color:var(--color-text-muted);font-weight:500;white-space:normal;vertical-align:top">{{ r.label }}</td><td class="num" onClick="{{ r.openA }}" style="cursor:pointer;vertical-align:top" style-hover="background:#F1F5F9"><div style="font-size:14px;font-weight:700;white-space:nowrap">{{ r.a }}</div><sc-if value="{{ r.sa }}" hint-placeholder-val="{{ false }}"><div style="font-size:11.5px;color:var(--color-text-soft);white-space:nowrap;font-weight:400">{{ r.sa }}</div></sc-if><sc-if value="{{ r.bars }}" hint-placeholder-val="{{ false }}"><div class="hbtrack" style="height:4px;margin-top:4px"><div class="hbfill" style="width:{{ r.aw }}%;background:{{ t.cac }}"></div></div></sc-if></td><td class="num" onClick="{{ r.openB }}" style="cursor:pointer;vertical-align:top" style-hover="background:#F1F5F9"><div style="font-size:14px;font-weight:700;white-space:nowrap">{{ r.b }}</div><sc-if value="{{ r.sb }}" hint-placeholder-val="{{ false }}"><div style="font-size:11.5px;color:var(--color-text-soft);white-space:nowrap;font-weight:400">{{ r.sb }}</div></sc-if><sc-if value="{{ r.bars }}" hint-placeholder-val="{{ false }}"><div class="hbtrack" style="height:4px;margin-top:4px"><div class="hbfill" style="width:{{ r.bw }}%;background:{{ t.cbc }}"></div></div></sc-if></td></tr></sc-for></tbody></table>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:320},&quot;t&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;}}"></script>
</body>
</html>
